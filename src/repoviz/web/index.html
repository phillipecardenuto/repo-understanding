<header class="app-header">

  <button role="tab" id="tabbtn-dependencies" aria-controls="tab-dependencies" data-tab="dependencies" aria-selected="false">Dependencies</button>
  <button role="tab" id="tabbtn-activity" aria-controls="tab-activity" data-tab="activity" aria-selected="false">Activity &amp; Flow</button>
</nav>
<main>
  <section class="tabpanel" id="tab-changes" role="tabpanel" aria-labelledby="tabbtn-changes"></section>
  <section class="tabpanel" id="tab-structure" role="tabpanel" aria-labelledby="tabbtn-structure" hidden></section>
  <section class="tabpanel" id="tab-dependencies" role="tabpanel" aria-labelledby="tabbtn-dependencies" hidden></section>
  <section class="tabpanel" id="tab-activity" role="tabpanel" aria-labelledby="tabbtn-activity" hidden></section>
